<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário de Convívios</title>
    <!-- Tailwind CSS CDN para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            📅 Calendário de Convívios
        </h1>
        <p class="text-sm bg-indigo-700 py-1 px-3 rounded-full">Equipa: 3 Alunos + 3 Agentes</p>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">

        <!-- Controlo do Calendário (Mês / Ano) -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 flex justify-between items-center">
            <button id="prevMonth" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg transition">
                &larr; Mês Anterior
            </button>
            <h2 id="monthYearDisplay" class="text-xl font-bold text-indigo-900">Mês Ano</h2>
            <button id="nextMonth" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg transition">
                Próximo Mês &rarr;
            </button>
        </div>

        <!-- Grelha dos Dias da Semana -->
        <div class="bg-white rounded-xl shadow-sm p-4">
            <div class="grid grid-cols-7 gap-2 text-center font-semibold text-slate-400 mb-2">
                <div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div><div>Dom</div>
            </div>
            <!-- Grelha dinamicamente preenchida por JS -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
        </div>
    </main>

    <!-- Modal de Convívio do Dia -->
    <div id="dayModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalDateTitle" class="text-xl font-bold text-indigo-900">Data</h3>
                <button id="closeModal" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>

            <!-- Lista de Fotos Existentes -->
            <div class="mb-6">
                <h4 class="font-semibold text-slate-700 mb-2">Fotos do Convívio</h4>
                <div id="photosContainer" class="grid grid-cols-2 gap-3">
                    <p class="text-sm text-slate-400 col-span-2">A carregar fotos...</p>
                </div>
            </div>

            <!-- Formulário para Adicionar Foto -->
            <form id="uploadForm" class="border-t pt-4 space-y-4">
                <input type="hidden" id="selectedDateInput" name="date">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">O teu Nome</label>
                    <input type="text" id="userName" name="user" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ex: João Silva">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Legenda / Descrição</label>
                    <input type="text" id="photoCaption" name="caption" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ex: Jantar de curso no tasco">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Selecionar Foto</label>
                    <input type="file" id="photoFile" name="photo" accept="image/*" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition shadow-sm">
                    Enviar Foto do Convívio
                </button>
            </form>
        </div>
    </div>

    <!-- Script de Lógica do Frontend -->
    <script src="app.js"></script>
</body>
</html>
